name: Build Image

# Reusable single-image build: per-arch builds pushed by digest, then merged
# into one multi-arch manifest. Called by docker-build.yml (source changes)
# and docker-refresh.yml (scheduled dependency refresh).

on:
  workflow_call:
    inputs:
      image:
        description: Image name without the registry/owner prefix (e.g. agentor-worker)
        required: true
        type: string
      context:
        description: Build context directory
        required: true
        type: string
      push:
        description: Push to GHCR. When false the image is built and discarded (PR validation).
        required: false
        default: true
        type: boolean
      refresh:
        description: >
          Rebuild from scratch — re-pull the base image and ignore the layer cache
          so unpinned dependencies (apt packages, agent CLIs) resolve to current versions.
        required: false
        default: false
        type: boolean
      tags:
        description: docker/metadata-action tag rules for the merged manifest
        required: false
        default: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # A refresh must not reuse cached apt/npm layers, and must re-resolve
          # the base image tag, or nothing would actually get updated.
          no-cache: ${{ inputs.refresh }}
          pull: ${{ inputs.refresh }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.suffix }}
          # Always export, including on a refresh — the next source-change build
          # then starts from the refreshed layers instead of the stale ones.
          cache-to: type=gha,scope=${{ inputs.image }}-${{ matrix.suffix }},mode=max

      - if: inputs.push
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.suffix }}"

      - if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: ${{ inputs.image }}-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }}
          tags: ${{ inputs.tags }}

      - run: |
          cd /tmp/digests
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }}
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=$(for f in *; do echo "$IMAGE@$(cat $f)"; done)
          docker buildx imagetools create $TAGS $SOURCES
