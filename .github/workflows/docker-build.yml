name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orchestrator:
              - 'orchestrator/**'
              - '.github/workflows/docker-build.yml'
              - '.github/workflows/docker-image.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/docker-build.yml'
              - '.github/workflows/docker-image.yml'

  orchestrator:
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: agentor-orchestrator
      context: ./orchestrator
      push: ${{ github.event_name != 'pull_request' }}

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: agentor-worker
      context: ./worker
      push: ${{ github.event_name != 'pull_request' }}
